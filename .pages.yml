media:
  input: media
  output: /media

content:
  - name: website
    label: Love Chloe Website
    type: file
    path: content/site.json
    format: json
    fields:
      - name: hero_eyebrow
        label: Homepage Small Heading
        type: string

      - name: hero_title
        label: Homepage Main Heading
        type: string

      - name: hero_description
        label: Homepage Description
        type: rich-text

      - name: hero_description_align
        label: Homepage Description - Text Alignment
        type: select
        options:
          - label: Left
            value: left
          - label: Centre
            value: center
          - label: Right
            value: right

      - name: hero_image
        label: Homepage Main Photograph
        type: image

      - name: collections_intro
        label: Collections Introduction
        type: rich-text

      - name: collections_intro_align
        label: Collections Introduction - Text Alignment
        type: select
        options:
          - label: Left
            value: left
          - label: Centre
            value: center
          - label: Right
            value: right

      - name: collection_1_title
        label: Collection 1 Title
        type: string

      - name: collection_1_description
        label: Collection 1 Description
        type: rich-text

      - name: collection_1_description_align
        label: Collection 1 Description - Text Alignment
        type: select
        options:
          - label: Left
            value: left
          - label: Centre
            value: center
          - label: Right
            value: right

      - name: collection_1_image
        label: Collection 1 Photograph
        type: image

      - name: collection_2_title
        label: Collection 2 Title
        type: string

      - name: collection_2_description
        label: Collection 2 Description
        type: rich-text

      - name: collection_2_description_align
        label: Collection 2 Description - Text Alignment
        type: select
        options:
          - label: Left
            value: left
          - label: Centre
            value: center
          - label: Right
            value: right

      - name: collection_2_image
