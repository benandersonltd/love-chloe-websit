
media:
  input: media
  output: /media

content:
  - name: website
    label: Love Chloe Website
    type: file
    path: content/site.json
    format: json
    fields:
      - name: hero_eyebrow
        label: Homepage Small Heading
        type: string

      - name: hero_title
        label: Homepage Main Heading
        type: string

      - name: hero_description
        label: Homepage Description
        type: rich-text

      - name: hero_description_align
        label: Homepage Description Alignment
        type: select
        default: left
        options:
          - label: Left
            value: left
          - label: Centre
            value: center
          - label: Right
            value: right

      - name: hero_image
        label: Homepage Main Photograph
        type: image

      - name: collections_intro
        label: Collections Introduction
        type: rich-text

      - name: collections_intro_align
        label: Collections Introduction Alignment
        type: select
        default: center
